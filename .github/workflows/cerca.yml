name: cerca
on:
  workflow_dispatch:
  push:
    paths:
      - normattiva/cerca_dazio.py
permissions:
  contents: write
jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python normattiva/cerca_dazio.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add normattiva/out/dazio
          git commit -m "Normattiva: ricerca dazio 1926-1939" || exit 0
          git pull --rebase -q && git push
