name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - normattiva/probe.sh
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash normattiva/probe.sh
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add normattiva/probe
          git commit -m "Normattiva: test formati" || exit 0
          git push
