name: run
on:
  workflow_dispatch:
    inputs:
      export:
        description: "codici file da esportare (spazio), oppure all"
        default: "all"
  push:
    paths:
      - normattiva/run.py
      - normattiva/run_args.txt
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q normattiva-sdk requests
      - run: python normattiva/run.py ${{ github.event.inputs.export || '' }} $(cat normattiva/run_args.txt 2>/dev/null)
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add normattiva/out
          git commit -m "Normattiva: ricerca ed export" || exit 0
          git pull --rebase -q && git push
